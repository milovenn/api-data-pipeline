    <text x="600" y="181" text-anchor="middle" fill="url(#heading)" font-family="Inter Display, Inter, Helvetica Neue, Arial, sans-serif" font-size="55" font-weight="600" letter-spacing="-1.2">API Data Pipeline</text>
    <text x="600" y="226" text-anchor="middle" fill="#b5b5bb" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing=".12">n8n pipeline that fetches paginated API data, cleans it and syncs it to Google Sheets.</text>
  </g>
